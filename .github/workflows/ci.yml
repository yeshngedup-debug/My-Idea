name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Non-secret placeholder values so lint/typecheck/unit tests/build run
      # without real Neon credentials. E2E tests are skipped without real creds.
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_NEON_REALTIME_URL: http://localhost:3000
      NEON_AUTH_BASE_URL: https://placeholder.auth.neon.app
      # Placeholder only, >= 32 characters so runtime validation would pass.
      NEON_AUTH_COOKIE_SECRET: ci-placeholder-cookie-secret-0123456789abcdef
      DATABASE_URL: postgresql://placeholder:placeholder@placeholder-pooler.neon.tech/db?sslmode=require
      VITE_CONFIG_NATIVE_IGNORE_WARNING: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run unit tests (Vitest)
        run: npm run test

      - name: Production build (Next.js)
        run: npm run build

  # Opt-in: enable E2E in repository variables once a seeded Neon branch and
  # the E2E_* credentials are configured as secrets. With E2E_REQUIRE_DB=1 a
  # missing database fails the job instead of skipping.
  e2e:
    if: ${{ vars.E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    needs: test
    env:
      E2E_REQUIRE_DB: '1'
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_NEON_REALTIME_URL: ${{ secrets.E2E_NEON_REALTIME_URL }}
      NEON_AUTH_BASE_URL: ${{ secrets.E2E_NEON_AUTH_BASE_URL }}
      NEON_AUTH_COOKIE_SECRET: ${{ secrets.E2E_NEON_AUTH_COOKIE_SECRET }}
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      NEON_REALTIME_SECRET: ${{ secrets.E2E_NEON_REALTIME_SECRET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.E2E_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.E2E_AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.E2E_AWS_ENDPOINT_URL_S3 }}
      AWS_REGION: ${{ secrets.E2E_AWS_REGION }}
      E2E_STUDENT_EMAIL: ${{ secrets.E2E_STUDENT_EMAIL }}
      E2E_STUDENT_PASSWORD: ${{ secrets.E2E_STUDENT_PASSWORD }}
      E2E_FOUNDER_EMAIL: ${{ secrets.E2E_FOUNDER_EMAIL }}
      E2E_FOUNDER_PASSWORD: ${{ secrets.E2E_FOUNDER_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_PAYMENT_FOUNDER_EMAIL: ${{ secrets.E2E_PAYMENT_FOUNDER_EMAIL }}
      E2E_PAYMENT_FOUNDER_PASSWORD: ${{ secrets.E2E_PAYMENT_FOUNDER_PASSWORD }}
      VITE_CONFIG_NATIVE_IGNORE_WARNING: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright flows
        run: npm run test:e2e
