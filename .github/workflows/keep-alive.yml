# Keeps the free-tier Supabase project awake (it pauses after ~7 days
# without API/DB activity) and keeps Vercel serverless functions warm.
# Pings the app's /api/health, which runs a real DB round-trip.
name: Keep-alive ping

on:
  schedule:
    - cron: '0 */12 * * *' # every 12 hours (UTC) — well within the pause window
  workflow_dispatch: # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 30 \
            https://myidea-virid.vercel.app/api/health)
          echo "HTTP $code"
          cat /tmp/health.json
          echo ""
          test "$code" = "200"
