<!-- ARCHIVED CONCEPT — rejected exploration, NOT the shipped mark and not used by the live UI. The extra rising dot was rejected; the shipped mark is two equal dots + one bridge + one amber arch cap (components/ui/logo.tsx). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">Bhutan Tech Connect — concept C symbol (gateway + rising dot)</title>
  <!-- Grid unit = 2. Baseline y=184, arch crown y=64 (optical centre above geometric). All filled, no strokes. -->
  <g id="symbol" fill="#000000">
    <!-- gateway posts -->
    <rect x="88" y="104" width="14" height="80" />   <!-- left post -->
    <rect x="154" y="104" width="14" height="80" />  <!-- right post -->
    <!-- arch band over the posts -->
    <path d="M 88 104 Q 128 64 168 104 L 154 118 Q 128 78 102 118 L 88 104 Z" />
    <!-- threshold at the base -->
    <rect x="88" y="172" width="80" height="8" rx="4" />
    <!-- rising dot: opportunity / student rising through the gateway -->
    <circle cx="128" cy="88" r="9" />
  </g>
</svg>
